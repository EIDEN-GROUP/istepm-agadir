# ─────────────────────────────────────────────────────────────────────────────
# PROJECT_LOCK_ENABLED=true — global access gate (server-side enforcement).
#
# Style de l'inclusion : directives au niveau `server` (héritées par toutes les
# locations) + exemptions minimales. Toute requête passe par `auth_request`,
# qui interroge le backend (session de gate opaque, HttpOnly).
# ─────────────────────────────────────────────────────────────────────────────

auth_request /_gate_verify;
error_page 401 = @gate_redirect;

# Subrequest interne de vérification (jamais exposée au client).
# `resolver` + variable = résolution DNS à la requête (Docker/Swarm), donc le
# démarrage de nginx n'échoue pas si le backend n'est pas encore prêt.
location = /_gate_verify {
    internal;
    auth_request off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gate_backend "backend:3000";
    proxy_pass http://$gate_backend/api/project-gate/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Original-URI $request_uri;
    proxy_http_version 1.1;
}

location @gate_redirect {
    return 302 /project-gate;
}

# Écran de gate + ses assets : seuls éléments publics nécessaires.
location = /project-gate {
    auth_request off;
    try_files /project-gate.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
}

location = /project-gate-assets/gate.css {
    auth_request off;
    expires 1h;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'" always;
}

location = /project-gate-assets/gate.js {
    auth_request off;
    expires 1h;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'" always;
}
