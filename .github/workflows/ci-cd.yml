name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint
        continue-on-error: true # Lint warnings should not block CI

      - name: Run tests
        run: npm test
        continue-on-error: true # No tests written yet

      - name: Build TypeScript
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.js

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint
        continue-on-error: true

      - name: Build for production
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com/api

      - name: Verify build output
        run: test -f dist/index.html

  # Note: We are not running end-to-end tests here because they would require both
  # backend and frontend to be running and a test suite set up (like Cypress or Playwright).
  # If you have such tests, you can add a job that depends on backend and frontend and runs them.
