name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  DOMAIN: ${{ vars.DOMAIN || 'istepm-agadir.eiden-group.com' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run lint
        continue-on-error: true

      - run: npm test
        continue-on-error: true

      - run: npm run build

      - run: test -f dist/index.js

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint
        continue-on-error: true

      - run: npm run build
        env:
          VITE_API_URL: https://${{ env.DOMAIN }}/api

      - run: test -f dist/index.html

  docker-build:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_WRITE_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/eiden-group/istepm-agadir/school-crm-api:latest
            ${{ env.REGISTRY }}/eiden-group/istepm-agadir/school-crm-api:${{ github.sha }}

      - name: Build frontend SPA
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: https://${{ env.DOMAIN }}/api

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/eiden-group/istepm-agadir/school-crm-frontend:latest
            ${{ env.REGISTRY }}/eiden-group/istepm-agadir/school-crm-frontend:${{ github.sha }}

      - name: Build and push backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.backup
          push: true
          tags: |
            ${{ env.REGISTRY }}/eiden-group/istepm-agadir/school-crm-backup:latest
            ${{ env.REGISTRY }}/eiden-group/istepm-agadir/school-crm-backup:${{ github.sha }}

  deploy:
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e

            REPO_DIR="/home/istepm-agadir/istepm-agadir"

            cd "$REPO_DIR"

            # Pull latest compose changes
            git pull origin main

            # Write .env.production from GitHub secret
            cat > .env.production << 'ENVEOF'
            ${{ secrets.ENV_PRODUCTION }}
            ENVEOF

            # Authenticate with GHCR for pulling images
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u eiden-group --password-stdin

            # Pull the latest images
            docker pull ghcr.io/eiden-group/istepm-agadir/school-crm-api:${{ github.sha }}
            docker pull ghcr.io/eiden-group/istepm-agadir/school-crm-frontend:${{ github.sha }}
            docker pull ghcr.io/eiden-group/istepm-agadir/school-crm-backup:${{ github.sha }}

            # Retag as latest for convenience
            docker tag ghcr.io/eiden-group/istepm-agadir/school-crm-api:${{ github.sha }} ghcr.io/eiden-group/istepm-agadir/school-crm-api:latest
            docker tag ghcr.io/eiden-group/istepm-agadir/school-crm-frontend:${{ github.sha }} ghcr.io/eiden-group/istepm-agadir/school-crm-frontend:latest
            docker tag ghcr.io/eiden-group/istepm-agadir/school-crm-backup:${{ github.sha }} ghcr.io/eiden-group/istepm-agadir/school-crm-backup:latest

            # Export env vars from .env.production for docker stack deploy
            set -a
            . .env.production
            set +a

            # Deploy the stack
            docker stack deploy -c docker-compose.production.yml school-crm --with-registry-auth --prune

            # Wait for postgres service to be ready (up to 3 minutes)
            echo "Waiting for postgres to be ready..."
            for i in $(seq 1 60); do
              PG_CONTAINER=$(docker ps --filter name=school-crm_postgres --format '{{.Names}}' | head -1)
              [ -n "$PG_CONTAINER" ] && docker exec "$PG_CONTAINER" pg_isready -U postgres 2>/dev/null && break
              echo "  Waiting... ($i)"
              sleep 3
            done || echo "Postgres wait timed out, proceeding anyway..."

            # Run database migrations inside the updated backend task.
            # A one-off swarm service was flaky here: fresh tasks raced the
            # rolling update and failed DNS for `postgres` (ENOTFOUND).
            # Exec reuses the backend task's own network + env, like deploy.sh.
            echo "Running database migrations..."
            # Hygiene: remove any leftover one-off migrate service
            docker service rm school-crm-migrate 2>/dev/null || true

            # Wait for the backend rolling update to finish so we migrate
            # from a task running the NEW image (which carries 0013).
            for i in $(seq 1 60); do
              STATE=$(docker service inspect --format '{{.UpdateStatus.State}}' school-crm_backend 2>/dev/null || echo "")
              if [ "$STATE" = "completed" ] || [ -z "$STATE" ]; then
                echo "Backend update state: ${STATE:-none (first deploy)}"
                break
              fi
              echo "  Backend update state: $STATE ($i)"
              sleep 5
            done

            # Wait for a backend task to answer /health
            BACKEND_CONTAINER=""
            for i in $(seq 1 60); do
              BACKEND_CONTAINER=$(docker ps --filter name=school-crm_backend --format '{{.ID}}' | head -1)
              if [ -n "$BACKEND_CONTAINER" ]; then
                if docker exec "$BACKEND_CONTAINER" node --eval "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" 2>/dev/null; then
                  echo "Backend is healthy, running migrations..."
                  break
                fi
                echo "  Backend task starting... ($i)"
              else
                echo "  Waiting for backend task... ($i)"
              fi
              BACKEND_CONTAINER=""
              sleep 5
            done
            if [ -z "$BACKEND_CONTAINER" ]; then
              echo "Backend never became healthy"
              docker service logs school-crm_backend --tail 50
              exit 1
            fi

            MIG_OK=0
            for i in 1 2 3; do
              if docker exec "$BACKEND_CONTAINER" node --import tsx/esm dist/db/migrate.js; then
                echo "Migration completed successfully"
                MIG_OK=1
                break
              fi
              echo "  Migration attempt $i failed, retrying in 10s..."
              sleep 10
            done
            if [ "$MIG_OK" != "1" ]; then
              echo "Migration failed"
              docker service logs school-crm_backend --tail 50
              exit 1
            fi

            echo "Deployment complete!"
