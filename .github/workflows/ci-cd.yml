name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Start server and run basic health check
        run: |
          npm start &
          SERVER_PID=$!
          # Wait for server to start (adjust time as needed)
          sleep 15
          # Try to hit the health endpoint (if exists) or just check if server is up
          # If there's no health endpoint, we can check the root or a known endpoint.
          # We'll try the root and expect a 200 or 404 (if not defined) but at least the server is responding.
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ | grep -q "2\|3\|4" || exit 1
          kill $SERVER_PID

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Build for production
        run: npm run build

      - name: Preview build (optional)
        run: |
          npm run preview &
          PREVIEW_PID=$!
          sleep 10
          curl -s http://localhost:4173 || exit 1
          kill $PREVIEW_PID

  # Note: We are not running end-to-end tests here because they would require both
  # backend and frontend to be running and a test suite set up (like Cypress or Playwright).
  # If you have such tests, you can add a job that depends on backend and frontend and runs them.