server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Root directory for the SPA
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets (hash-based filenames from Vite build)
    # NOTE: nginx drops inherited add_header inside location blocks, so the
    # security headers are repeated here on purpose.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # SPA — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Coquille SPA (index.html) : jamais de cache navigateur. Sans ceci, les
    # navigateurs gardent l'ancien bundle après un déploiement (erreurs
    # fantômes sur des routes déjà corrigées). Les assets hachés restent
    # immuables (bloc /assets/ ci-dessus).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
